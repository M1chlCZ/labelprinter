name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils netpbm
      - name: Install Python dependencies
        run: python3 -m pip install pypdf
      - name: Build the raster converter
        run: cc -O2 -o pbmtodp pbmtodp.c
      - name: Test
        env:
          LABELPRINTER_PBMTODP: ${{ github.workspace }}/pbmtodp
        run: python3 -B -m unittest discover -s tests -v
